name: Fetch Financial News
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install akshare requests
      - name: Fetch Financial News via akshare
        run: |
          python << 'PYEOF'
          import json, datetime, requests

          now = datetime.datetime.now()
          news = []
          def add(t, u, b, s, ts=''):
              ts = ts or now.strftime('%m-%d %H:%M')
              news.append({'rank': len(news)+1, 'title': str(t)[:120], 'url': str(u)[:500], 'time': ts, 'body': str(b)[:400], 'source': s})

          # === 1. Market index data (stable) ===
          try:
              r = requests.get(
                  'https://push2.eastmoney.com/api/qt/ulist.np/get',
                  params={'fltt':'2','fields':'f2,f3,f12,f14,f6',
                          'secids':'1.000001,0.399001,0.399006,1.000688'},
                  headers={'User-Agent':'Mozilla/5.0'}, timeout=10
              )
              d = r.json()
              idx_all = {'000001':('上证指数','sh000001'),'399001':('深证成指','sz399001'),
                         '399006':('创业板指','sz399006'),'000688':('科创50','sh000688')}
              summary = []
              for idx in d.get('data',{}).get('diff',[]):
                  code = idx['f12']
                  if code in idx_all:
                      nm = idx_all[code][0]; pct = idx.get('f3',0) or 0
                      val = idx.get('f2',''); amt = (idx.get('f6',0) or 0)/1e8
                      a = '涨' if pct>0 else '跌' if pct<0 else '平'
                      summary.append(f'{nm}{a}{abs(pct):.2f}%')
                      add(f'收盘播报：{nm}{a}{abs(pct):.2f}% 报{val}点 成交{amt:.0f}亿',
                          f'https://quote.eastmoney.com/zs{code}.html',
                          f'今日{nm}收盘报{val}点，{a}幅{abs(pct):.2f}%，成交额{amt:.0f}亿元。', 'eastmoney')
              if summary: add('今日A股收盘综述：'+'，'.join(summary),
                  'https://quote.eastmoney.com/zs000001.html','今日A股收盘：'+'；'.join(summary),'eastmoney')
          except Exception as e: print(f'Market: {e}')

          # === 2. Real news via akshare (EastMoney financial news) ===
          try:
              import akshare as ak
              df = ak.stock_info_global_em()
              if df is not None and len(df) > 0:
                  added = 0
                  for _, row in df.head(8).iterrows():
                      title = str(row.iloc[0]) if len(row) > 0 else ''
                      if title and len(title) > 5 and '收盘播报' not in title:
                          add(title, 'https://finance.eastmoney.com/', title[:200], 'eastmoney')
                          added += 1
                  print(f'akshare real news: {added} items')
              else:
                  print('akshare news: empty')
          except Exception as e:
              print(f'akshare news: {e}')

          # === Fill remaining slots ===
          if len(news) < 10:
              add('投资提醒：股市有风险，投资需谨慎。本文内容仅供参考，不构成投资建议。',
                  '#', '请根据自身风险承受能力做出独立判断。', 'sina')
              add('数据来源：东方财富、财联社、新浪财经。每日自动更新。',
                  '#', '所有数据来自公开市场信息，由GitHub Actions自动抓取生成。', 'sina')

          news = news[:10]
          with open('news-data.json','w',encoding='utf-8') as f:
              json.dump({'updated':now.isoformat(),'news':news}, f, ensure_ascii=False)
          print(f'Done: {len(news)} items')
          for n in news:
              print(f'  [{n["source"]}] {n["title"][:80]}')
          PYEOF
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news-data.json
          git diff --staged --quiet || git commit -m "auto: update financial news [skip ci]"
          git push
