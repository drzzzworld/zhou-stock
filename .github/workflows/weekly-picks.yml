name: Weekly Quantitative Stock Picks
on:
  schedule:
    - cron: '30 11 * * 5'  # Every Friday 19:30 CST (after market close)
  workflow_dispatch:        # Manual trigger

jobs:
  update-picks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install baostock pandas python-dotenv
      - name: Clone Sequoia-X
        run: |
          git clone --depth 1 https://github.com/sngyai/Sequoia-X.git /tmp/sequoia-x
          pip install -e /tmp/sequoia-x
      - name: Run quantitative screening
        run: |
          python bridge.py
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.js
          git diff --staged --quiet || git commit -m "auto: weekly quantitative stock picks update"
          git push
