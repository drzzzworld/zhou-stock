name: Update Stock Prices
on:
  schedule:
    - cron: '*/5 1-7 * * 1-5'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch stock prices
        run: |
          python << 'PYEOF'
          import requests, json, datetime, re

          now = datetime.datetime.now()
          if now.weekday() >= 5:
              print('Weekend - skipping')
              exit(0)

          codes = ['sz002049','sz002709','sz002444','sz002156','sz000651',
                   'sh600460','sh603259','sz300750','sh605358','sh688981']

          stocks = {}
          try:
              r = requests.get(
                  'https://hq.sinajs.cn/list=' + ','.join(codes),
                  headers={'User-Agent':'Mozilla/5.0','Referer':'https://finance.sina.com.cn/'},
                  timeout=15
              )
              r.encoding = 'gbk'
              for code in codes:
                  m = re.search(r'hq_str_'+code+r'="(.+?)"', r.text)
                  if m:
                      flds = m.group(1).split(',')
                      if len(flds) >= 4:
                          name = flds[0].replace(' ','')
                          price = float(flds[3])
                          prev = float(flds[2])
                          if name and price > 0 and prev > 0:
                              stocks[name] = {
                                  'price': price,
                                  'changePct': round((price-prev)/prev*100, 2)
                              }
          except Exception as e:
              print(f'API error: {e}')

          if stocks:
              result = {'updated': now.isoformat(), 'stocks': stocks}
              with open('prices.json', 'w', encoding='utf-8') as f:
                  json.dump(result, f, ensure_ascii=False)
              cnt = len(stocks)
              print(f'Updated {cnt} prices')
              for n, d in stocks.items():
                  p = d['price']
                  c = d['changePct']
                  print(f'  {n}: {p} ({c:+.2f}%)')
          PYEOF
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "auto: stock prices [skip ci]"
          git push
